<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tercio Español - Cyberskeleton</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        .scene-container {
            width: 600px;
            height: 600px;
            position: relative;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.8));
        }

        /* Animación de la pantalla del portátil parpadeando suavemente */
        @keyframes screenGlow {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        .laptop-screen-light {
            animation: screenGlow 3s infinite ease-in-out;
        }

        /* Reflejo de la pantalla en la calavera */
        .skull-group {
            filter: drop-shadow(0 0 5px rgba(100, 180, 255, 0.3));
        }
    </style>
</head>
<body>

<div class="scene-container">
    <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Gradiente para la pantalla del portátil -->
            <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e3c72;stop-opacity:1" />
            </linearGradient>
            <!-- Gradiente para el escritorio -->
            <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#4e342e;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#3e2723;stop-opacity:1" />
            </linearGradient>
        </defs>

        <!-- Fondo de la habitación -->
        <rect width="600" height="600" fill="#2c2c2c" />

        <!-- Escritorio -->
        <path d="M 50 450 L 550 450 L 600 600 L 0 600 Z" fill="url(#deskGrad)" />
        <line x1="50" y1="450" x2="550" y2="450" stroke="#5d4037" stroke-width="4" />

        <!-- Silla (Básica) -->
        <path d="M 250 300 L 350 300 L 370 480 L 230 480 Z" fill="#222" opacity="0.5"/>
        
        <!-- ESQUELETO CUERPO -->
        <g id="skeleton-body" fill="#e0d8c8" stroke="#a09880" stroke-width="2">
            <!-- Columna vertebral -->
            <path d="M 300 260 L 300 420" stroke-width="8" stroke-linecap="round" fill="none"/>
            <!-- Costillas -->
            <path d="M 300 280 Q 260 280 260 310" fill="none" stroke-width="4"/>
            <path d="M 300 280 Q 340 280 340 310" fill="none" stroke-width="4"/>
            <path d="M 300 300 Q 255 300 255 330" fill="none" stroke-width="4"/>
            <path d="M 300 300 Q 345 300 345 330" fill="none" stroke-width="4"/>
            <path d="M 300 320 Q 260 320 260 345" fill="none" stroke-width="4"/>
            <path d="M 300 320 Q 340 320 340 345" fill="none" stroke-width="4"/>
            
            <!-- Brazos (tecleando) -->
            <!-- Brazo Izquierdo -->
            <path d="M 280 280 L 240 350 L 220 400" fill="none" stroke-width="6" stroke-linecap="round"/>
            <circle cx="220" cy="400" r="6" /> <!-- Mano -->
            
            <!-- Brazo Derecho -->
            <path d="M 320 280 L 360 350 L 380 400" fill="none" stroke-width="6" stroke-linecap="round"/>
            <circle cx="380" cy="400" r="6" /> <!-- Mano -->
        </g>

        <!-- PORTÁTIL -->
        <g id="laptop">
            <!-- Pantalla -->
            <rect x="180" y="330" width="240" height="150" rx="5" fill="#111" />
            <rect x="190" y="340" width="220" height="130" rx="2" fill="url(#screenGrad)" class="laptop-screen-light"/>
            <!-- Código en pantalla (decorativo) -->
            <text x="200" y="370" font-family="monospace" font-size="10" fill="#fff" opacity="0.8">&lt;TERCIO&gt;console.log();&lt;/TERCIO&gt;</text>
            <text x="200" y="390" font-family="monospace" font-size="10" fill="#aaffaa" opacity="0.8">Deploy: ESPAÑOL</text>
            
            <!-- Teclado/Base -->
            <path d="M 160 480 L 440 480 L 420 510 L 180 510 Z" fill="#333" />
            <rect x="190" y="485" width="220" height="10" rx="2" fill="#444" /> <!-- Trackpad -->
        </g>

        <!-- CABEZA DEL TERCIO (Basada en la referencia) -->
        <g id="tercio-head" class="skull-group" transform="translate(300, 230)">
            
            <!-- Flechas Rojas Cruzadas (Detrás de la calavera) -->
            <g fill="#8b0000" stroke="#600000" stroke-width="1">
                <!-- Flecha Izquierda-Derecha -->
                <path d="M -70 -80 L 70 80 L 60 90 L 80 90 L 80 70 L 70 80 L -70 -80 Z" /> <!-- Punta derecha -->
                <path d="M 70 -80 L -70 80 L -60 90 L -80 90 L -80 70 L -70 80 Z" /> <!-- Punta izquierda -->
                <rect x="-5" y="-80" width="10" height="160" transform="rotate(45)" fill="#8b0000" />
                <rect x="-5" y="-80" width="10" height="160" transform="rotate(-45)" fill="#8b0000" />
            </g>

            <!-- Calavera -->
            <path d="M 0 -60 C -50 -60 -60 -20 -60 10 C -60 40 -30 60 0 60 C 30 60 60 40 60 10 C 60 -20 50 -60 0 -60 Z" fill="#e0d8c8" stroke="#a09880" stroke-width="2"/>
            
            <!-- Cuencas de los ojos (con reflejo azul del monitor) -->
            <path d="M -25 -10 C -25 -25 -10 -25 -10 -10 C -10 5 -25 5 -25 -10 Z" fill="#0a0a0a"/>
            <path d="M 10 -10 C 10 -25 25 -25 25 -10 C 10 5 10 5 10 -10 Z" fill="#0a0a0a"/>
            <circle cx="-17" cy="-15" r="3" fill="#4a90e2" opacity="0.6"/> <!-- Reflejo monitor ojo izq -->
            <circle cx="
