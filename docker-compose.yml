services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_tridenguard
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=olive-unofficered-consuela.ngrok-free.dev
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://olive-unofficered-consuela.ngrok-free.dev
    volumes:
      - ~/.n8n_tridenguard:/home/node/.n8n
      - .:/data/tridenguard
    restart: unless-stopped
