services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_tridenguard
    # Restrict port to localhost to prevent external access
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=olive-unofficered-consuela.ngrok-free.dev
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://olive-unofficered-consuela.ngrok-free.dev
    volumes:
      # Data persistence remains writable
      - ~/.n8n_tridenguard:/home/node/.n8n
      # Project files mounted as READ-ONLY to prevent tampering from within the container
      - .:/data/tridenguard:ro
    # Security hardening
    security_opt:
      - no-new-privileges:true
    # Resource limits to prevent DoS/Resource exhaustion
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped
