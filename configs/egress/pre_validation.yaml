# Pre-Validation Egress Rules — Semantic Density & Source Integrity
# These rules ensure input has enough information before LLM extraction.

- name: pre_validation_density_check
  description: "Rejects input with insufficient semantic density before LLM extraction"
  priority: 75
  action: QUARANTINE
  conditions:
    - field: info_score
      match_type: threshold
      value: 2
      operator: lt

- name: radical_source_integrity_check
  description: "Verifies that every radical value exists literally in the source text"
  priority: 80
  action: QUARANTINE
  conditions:
    - field: source_integrity
      match_type: boolean
      value: false

- name: semantic_validation_engine
  description: "Clasifica la severidad del error semántico y decide la acción"
  priority: 80
  action: HUMAN_REVIEW
  conditions:
    - field: has_critical
      match_type: boolean
      value: true
