version: "1.0"
policy_name: "tridenguard_modular"

default_action: ALLOW

# ==========================================================================
# TRIDENGUARD UNIFIED SECURITY POLICY
# ==========================================================================
# Lobster Trap is the single source of truth for security policy enforcement.
# Rules are modularized by layer and domain.
# ==========================================================================

# === INGRESS RULES ==========================================================
# Prompt inspection before reaching the LLM.
#   - ingress/security_rules.yaml  (injection, malware, exfiltration, obfuscation, commands)
#   - ingress/content_rules.yaml   (harm, phishing, sensitive paths, roles, PII, risk)
# =============================================================================
ingress_rules:
  !include ingress/security_rules.yaml
  !include ingress/content_rules.yaml

# === EGRESS RULES ===========================================================
# Output inspection before entering the validation pipeline.
#   - egress/schema_compliance.yaml  (credential leaks, PII leaks, schema structure)
#   - egress/pre_validation.yaml     (semantic density, source integrity)
# =============================================================================
egress_rules:
  !include egress/schema_compliance.yaml
  !include egress/pre_validation.yaml

# === QUARANTINE RULES =======================================================
# Rejection classification from the Deterministic Validator.
#   - quarantine/critical_rules.yaml  (R1-R3 → CRITICAL → priority review)
#   - quarantine/warning_rules.yaml   (R5-R7 → WARNING → deferred review)
#   - quarantine/unknown_rules.yaml   (new patterns → INCUBATOR → V3)
# =============================================================================
quarantine_rules:
  !include quarantine/critical_rules.yaml
  !include quarantine/warning_rules.yaml
  !include quarantine/unknown_rules.yaml

# === RATE LIMITS =============================================================
rate_limits:
  requests_per_minute: 120
  requests_per_hour: 2000
  burst_threshold: 30

# === NETWORK POLICY ==========================================================
network:
  egress_policy: allowlist
  allowed_domains:
    - "api.openai.com"
    - "api.anthropic.com"
  denied_domains:
    - "*.onion"
    - "pastebin.com"

# === FILESYSTEM POLICY =======================================================
filesystem:
  denied_paths:
    - "/etc/**"
    - "/root/**"
    - "**/.ssh/**"
    - "**/.env"
    - "**/*secret*"
    - "**/*password*"
  allowed_read_paths:
    - "/home/*/documents/**"
    - "/tmp/agent_workspace/**"
  allowed_write_paths:
    - "/home/*/documents/agent_output/**"
    - "/tmp/agent_workspace/**"
